<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>프롬프터</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #e8c96d;
    --accent2: #6de8c9;
    --text: #f0f0f0;
    --muted: #555;
    --panel-w: 300px;
    --bar-h: 72px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── TOP BAR 고정 2행 ── */
  #topbar {
    height: var(--bar-h);
    min-height: var(--bar-h);
    max-height: var(--bar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 8px;
    gap: 4px;
    overflow: hidden;
  }

  .bar-row {
    display: flex;
    align-items: center;
    gap: 4px;
    flex-wrap: nowrap;
  }

  .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
    min-width: 62px;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 3px;
    border-left: 1px solid var(--border);
    padding-left: 6px;
  }

  .ctrl-label {
    font-size: 9px;
    color: var(--muted);
    white-space: nowrap;
  }

  /* 숫자 직접입력 */
  .num-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    width: 42px;
    height: 22px;
    text-align: center;
    outline: none;
    padding: 0 2px;
  }
  .num-input:focus { border-color: var(--accent); }
  .num-unit { font-size: 9px; color: var(--muted); }

  /* 속도: 작은 슬라이더만 유지 */
  input[type=range] {
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }
  .val-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent);
    min-width: 22px;
    text-align: right;
  }

  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 3px 7px;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
    font-family: inherit;
    height: 24px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
  }
  .btn:hover, .btn:active { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }

  #playBtn {
    font-size: 14px;
    padding: 3px 10px;
    border-color: var(--accent2);
    color: var(--accent2);
    min-width: 38px;
    height: 24px;
  }
  #playBtn:hover, #playBtn.active { background: var(--accent2); color: #000; border-color: var(--accent2); }
  #boldBtn { font-weight: 700; font-size: 12px; min-width: 24px; }

  /* ── SEARCH BAR ── */
  #searchBar {
    display: none;
    align-items: center;
    gap: 5px;
    padding: 4px 8px;
    background: #0f0f0f;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #searchBar.open { display: flex; }
  #searchInput {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 13px;
    padding: 4px 8px;
    outline: none;
    font-family: inherit;
  }
  #searchInput:focus { border-color: var(--accent2); }
  #searchInfo {
    font-size: 10px;
    color: var(--muted);
    min-width: 46px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── MAIN ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── SCRIPT PANEL ── */
  #scriptPanel {
    width: var(--panel-w);
    min-width: 160px;
    background: #0d0d0d;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
  }
  #scriptPanel.hidden { display: none; }

  .panel-title {
    padding: 5px 10px;
    font-size: 9px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  #uploadArea {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex-shrink: 0;
  }
  #uploadArea .btn { width: 100%; font-size: 11px; height: 28px; }
  #uploadStatus {
    font-size: 9px;
    color: var(--accent2);
    min-height: 11px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
  #uploadStatus.err { color: #e86d6d; }

  #scriptInput {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 12px;
    line-height: 1.8;
    padding: 10px;
    resize: none;
    outline: none;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 0;
  }

  /* ── RESIZE ── */
  #resizeHandle {
    width: 4px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    touch-action: none;
  }
  #resizeHandle:hover, #resizeHandle.dragging { background: var(--accent); opacity: .4; }

  /* ── PROMPTER ── */
  #prompterWrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--bg);
    min-width: 0;
    touch-action: none;
  }

  /* 핀치 줌: prompterInner 전체를 scale */
  #prompterInner {
    width: 100%;
    height: 100%;
    transform-origin: top center;
    overflow: hidden;
  }

  #prompter {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 60px 0;
    scrollbar-width: none;
  }
  #prompter::-webkit-scrollbar { display: none; }

  #prompterContent {
    margin: 0 auto;
    line-height: 1.7;
    color: var(--text);
    word-break: break-word;
  }

  body.mirror #prompterContent { transform: scaleX(-1); }

  #prompterContent mark.hit {
    background: rgba(232,201,109,.25);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }
  #prompterContent mark.hit.current { background: var(--accent); color: #000; }

  #posBar {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border);
    pointer-events: none;
  }
  #posThumb {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    position: absolute;
    top: 0;
    transition: top .1s;
    min-height: 20px;
  }

  #speedHud {
    position: absolute;
    bottom: 10px;
    right: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    pointer-events: none;
  }

  /* 줌 레벨 표시 */
  #zoomHud {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    opacity: 0;
    transition: opacity .4s;
    pointer-events: none;
    white-space: nowrap;
  }
  #zoomHud.show { opacity: 1; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <!-- 1행: 수치 입력 -->
  <div class="bar-row">
    <span class="logo">PROMPTER</span>

    <div class="ctrl-group">
      <span class="ctrl-label">글자</span>
      <input class="num-input" type="number" id="fontInput" min="10" max="200" value="48">
      <span class="num-unit">px</span>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">너비</span>
      <input class="num-input" type="number" id="widthInput" min="20" max="100" value="80">
      <span class="num-unit">%</span>
    </div>

    <div class="ctrl-group">
      <span class="ctrl-label">줄간격</span>
      <input class="num-input" type="number" id="lineInput" min="1" max="4" step="0.1" value="1.7" style="width:38px">
    </div>

    <div class="ctrl-group">
      <button class="btn" id="boldBtn">B</button>
    </div>
  </div>

  <!-- 2행: 액션 버튼 + 속도 -->
  <div class="bar-row">
    <button class="btn" id="playBtn">▶</button>
    <button class="btn" id="resetBtn">↩</button>

    <div class="ctrl-group" style="border:none;padding:0;gap:4px">
      <span class="ctrl-label" style="font-size:9px">속도</span>
      <input type="range" id="speedRange" min="0" max="10" step="0.5" value="2" style="width:60px">
      <span class="val-badge" id="speedVal">2</span>
    </div>

    <div class="ctrl-group" style="margin-left:auto">
      <button class="btn" id="searchToggle">🔍</button>
      <button class="btn" id="mirrorBtn">⇆</button>
      <button class="btn" id="panelToggle">📝</button>
    </div>
  </div>
</div>

<!-- SEARCH BAR -->
<div id="searchBar">
  <input type="text" id="searchInput" placeholder="검색어 입력...">
  <span id="searchInfo">0 / 0</span>
  <button class="btn" id="prevHit">▲</button>
  <button class="btn" id="nextHit">▼</button>
  <button class="btn" id="closeSearch">✕</button>
</div>

<!-- MAIN -->
<div id="main">
  <div id="scriptPanel">
    <div class="panel-title">스크립트</div>
    <div id="uploadArea">
      <input type="file" id="fileInput" accept=".docx,.txt" style="display:none">
      <button class="btn" id="uploadBtn">📂 파일 불러오기 &nbsp;<span style="color:var(--muted);font-size:9px;">docx · txt</span></button>
      <div id="uploadStatus"></div>
    </div>
    <textarea id="scriptInput" placeholder="스크립트를 직접 입력하거나 파일을 불러오세요."></textarea>
  </div>
  <div id="resizeHandle"></div>
  <div id="prompterWrap">
    <div id="prompterInner">
      <div id="prompter">
        <div id="prompterContent"></div>
      </div>
    </div>
    <div id="posBar"><div id="posThumb"></div></div>
    <div id="speedHud">정지</div>
    <div id="zoomHud">100%</div>
  </div>
</div>

<script>
// ── STATE ──
const state = {
  text: `안녕하세요, 여러분.\n\n오늘 발표에 오신 것을 환영합니다.\n\n저는 오늘 우리 팀이 지난 한 달간 준비한 프로젝트에 대해 말씀드리려고 합니다.\n\n먼저 배경 설명부터 시작하겠습니다.\n\n고객들의 요구사항이 빠르게 변화하고 있으며, 우리는 그에 맞춰 발 빠르게 대응해야 했습니다.\n\n감사합니다.`,
  fontSize: 48, width: 80, speed: 2, lineHeight: 1.7, bold: false,
  playing: false, mirror: false,
  zoom: 1.0,
  searchHits: [], currentHit: -1,
  rafId: null, lastTs: null,
};

// ── ELEMENTS ──
const prompter        = document.getElementById('prompter');
const prompterInner   = document.getElementById('prompterInner');
const prompterContent = document.getElementById('prompterContent');
const prompterWrap    = document.getElementById('prompterWrap');
const scriptInput     = document.getElementById('scriptInput');
const fontInput       = document.getElementById('fontInput');
const widthInput      = document.getElementById('widthInput');
const lineInput       = document.getElementById('lineInput');
const boldBtn         = document.getElementById('boldBtn');
const playBtn         = document.getElementById('playBtn');
const resetBtn        = document.getElementById('resetBtn');
const speedRange      = document.getElementById('speedRange');
const speedVal        = document.getElementById('speedVal');
const mirrorBtn       = document.getElementById('mirrorBtn');
const panelToggle     = document.getElementById('panelToggle');
const searchToggle    = document.getElementById('searchToggle');
const searchBar       = document.getElementById('searchBar');
const searchInput     = document.getElementById('searchInput');
const searchInfo      = document.getElementById('searchInfo');
const prevHit         = document.getElementById('prevHit');
const nextHit         = document.getElementById('nextHit');
const closeSearch     = document.getElementById('closeSearch');
const posThumb        = document.getElementById('posThumb');
const speedHud        = document.getElementById('speedHud');
const scriptPanel     = document.getElementById('scriptPanel');
const resizeHandle    = document.getElementById('resizeHandle');
const zoomHud         = document.getElementById('zoomHud');

// ── INIT ──
scriptInput.value = state.text;
renderPrompter();
applyStyles();
panelToggle.classList.add('active');

// ── RENDER ──
function renderPrompter(keepRatio) {
  const ratio = keepRatio !== undefined ? keepRatio : getScrollRatio();
  prompterContent.innerHTML = toHtml(state.text);
  if (searchBar.classList.contains('open') && searchInput.value) applySearch(searchInput.value, false);
  requestAnimationFrame(() => { setScrollRatio(ratio); updatePosBar(); });
}

function toHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

function applyStyles(keepRatio) {
  const ratio = keepRatio !== undefined ? keepRatio : getScrollRatio();
  prompterContent.style.fontSize   = state.fontSize + 'px';
  prompterContent.style.width      = state.width + '%';
  prompterContent.style.lineHeight = state.lineHeight;
  prompterContent.style.fontWeight = state.bold ? '700' : '400';
  requestAnimationFrame(() => setScrollRatio(ratio));
}

function applyZoom(zoom, keepRatio) {
  const ratio = keepRatio !== undefined ? keepRatio : getScrollRatio();
  state.zoom = Math.min(3.0, Math.max(0.3, zoom));
  prompterInner.style.transform = `scale(${state.zoom})`;
  prompterInner.style.transformOrigin = 'top left';
  prompterInner.style.width  = (100 / state.zoom) + '%';
  prompterInner.style.height = (100 / state.zoom) + '%';
  // 줌 HUD 표시
  zoomHud.textContent = Math.round(state.zoom * 100) + '%';
  zoomHud.classList.add('show');
  clearTimeout(applyZoom._t);
  applyZoom._t = setTimeout(() => zoomHud.classList.remove('show'), 1200);
  requestAnimationFrame(() => setScrollRatio(ratio));
}

// ── SCROLL ──
function getScrollRatio() {
  const max = prompter.scrollHeight - prompter.clientHeight;
  return max <= 0 ? 0 : prompter.scrollTop / max;
}
function setScrollRatio(ratio) {
  const max = prompter.scrollHeight - prompter.clientHeight;
  prompter.scrollTop = ratio * max;
}
function updatePosBar() {
  const ratio  = getScrollRatio();
  const barH   = document.getElementById('posBar').clientHeight;
  const thumbH = Math.max(20, barH * (prompter.clientHeight / prompter.scrollHeight));
  posThumb.style.height = thumbH + 'px';
  posThumb.style.top    = (ratio * (barH - thumbH)) + 'px';
}
prompter.addEventListener('scroll', updatePosBar);

// ── NUM INPUTS ──
fontInput.addEventListener('change', () => {
  const v = Math.min(200, Math.max(10, +fontInput.value || 48));
  fontInput.value = v;
  state.fontSize = v;
  applyStyles(getScrollRatio());
});
widthInput.addEventListener('change', () => {
  const v = Math.min(100, Math.max(20, +widthInput.value || 80));
  widthInput.value = v;
  state.width = v;
  applyStyles(getScrollRatio());
});
lineInput.addEventListener('change', () => {
  const v = Math.min(4, Math.max(1, +lineInput.value || 1.7));
  lineInput.value = v;
  state.lineHeight = v;
  applyStyles(getScrollRatio());
});
boldBtn.addEventListener('click', () => {
  state.bold = !state.bold;
  boldBtn.classList.toggle('active', state.bold);
  applyStyles(getScrollRatio());
});
scriptInput.addEventListener('input', () => {
  state.text = scriptInput.value;
  renderPrompter(getScrollRatio());
});

// ── SPEED ──
speedRange.addEventListener('input', () => {
  state.speed = +speedRange.value;
  speedVal.textContent = state.speed;
  updateSpeedHud();
});

// ── PLAY ──
function updateSpeedHud() {
  speedHud.textContent = state.playing ? `▶ ×${state.speed}` : '정지';
}
function togglePlay() {
  state.playing = !state.playing;
  playBtn.textContent = state.playing ? '⏸' : '▶';
  playBtn.classList.toggle('active', state.playing);
  updateSpeedHud();
  if (state.playing) { state.lastTs = null; state.rafId = requestAnimationFrame(scrollTick); }
  else cancelAnimationFrame(state.rafId);
}
function scrollTick(ts) {
  if (!state.lastTs) state.lastTs = ts;
  const dt = ts - state.lastTs; state.lastTs = ts;
  prompter.scrollTop += state.speed * dt / 16;
  updatePosBar();
  if (prompter.scrollTop >= prompter.scrollHeight - prompter.clientHeight) {
    state.playing = false; playBtn.textContent = '▶'; playBtn.classList.remove('active'); updateSpeedHud(); return;
  }
  state.rafId = requestAnimationFrame(scrollTick);
}
playBtn.addEventListener('click', togglePlay);
resetBtn.addEventListener('click', () => { prompter.scrollTop = 0; updatePosBar(); });

// ── MIRROR ──
mirrorBtn.addEventListener('click', () => {
  state.mirror = !state.mirror;
  document.body.classList.toggle('mirror', state.mirror);
  mirrorBtn.classList.toggle('active', state.mirror);
});

// ── PANEL TOGGLE ──
panelToggle.addEventListener('click', () => {
  const ratio = getScrollRatio();
  scriptPanel.classList.toggle('hidden');
  panelToggle.classList.toggle('active', !scriptPanel.classList.contains('hidden'));
  requestAnimationFrame(() => setScrollRatio(ratio));
});

// ── SEARCH ──
searchToggle.addEventListener('click', openSearch);
function openSearch() { searchBar.classList.add('open'); searchInput.focus(); searchInput.select(); }
closeSearch.addEventListener('click', () => {
  searchBar.classList.remove('open');
  searchInput.value = '';
  clearHighlights();
  searchInfo.textContent = '0 / 0';
  state.searchHits = []; state.currentHit = -1;
});
searchInput.addEventListener('input', () => applySearch(searchInput.value, true));

function applySearch(query, resetIndex) {
  clearHighlights();
  state.searchHits = []; state.currentHit = -1;
  if (!query) { searchInfo.textContent = '0 / 0'; return; }
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  let idx = 0;
  prompterContent.innerHTML = toHtml(state.text).replace(regex, m =>
    `<mark class="hit" data-idx="${idx++}">${m}</mark>`
  );
  state.searchHits = Array.from(prompterContent.querySelectorAll('mark.hit'));
  searchInfo.textContent = `0 / ${state.searchHits.length}`;
  if (resetIndex && state.searchHits.length > 0) jumpToHit(0);
}
function jumpToHit(i) {
  if (!state.searchHits.length) return;
  if (state.currentHit >= 0 && state.currentHit < state.searchHits.length)
    state.searchHits[state.currentHit].classList.remove('current');
  state.currentHit = (i + state.searchHits.length) % state.searchHits.length;
  const el = state.searchHits[state.currentHit];
  el.classList.add('current');
  searchInfo.textContent = `${state.currentHit + 1} / ${state.searchHits.length}`;
  prompter.scrollTo({ top: el.offsetTop - prompter.clientHeight / 2 + el.offsetHeight / 2, behavior: 'smooth' });
  setTimeout(updatePosBar, 350);
}
nextHit.addEventListener('click', () => jumpToHit(state.currentHit + 1));
prevHit.addEventListener('click', () => jumpToHit(state.currentHit - 1));
function clearHighlights() { prompterContent.innerHTML = toHtml(state.text); }

// ── KEYBOARD ──
document.addEventListener('keydown', e => {
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') {
    if (e.key === 'Escape') { document.activeElement.blur(); closeSearch.click(); }
    return;
  }
  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); openSearch(); return; }
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); togglePlay(); return; }
  if (e.key === 'ArrowUp')   prompter.scrollBy({ top: -80, behavior: 'smooth' });
  if (e.key === 'ArrowDown') prompter.scrollBy({ top:  80, behavior: 'smooth' });
  if (e.key === 'Escape') closeSearch.click();
});

// ── RESIZE PANEL ──
let resizing = false, startX = 0, startW = 0;
resizeHandle.addEventListener('mousedown', e => { resizing = true; startX = e.clientX; startW = scriptPanel.offsetWidth; resizeHandle.classList.add('dragging'); });
resizeHandle.addEventListener('touchstart', e => { resizing = true; startX = e.touches[0].clientX; startW = scriptPanel.offsetWidth; resizeHandle.classList.add('dragging'); }, { passive: true });
document.addEventListener('mousemove', e => { if (!resizing) return; scriptPanel.style.width = Math.max(160, Math.min(600, startW + e.clientX - startX)) + 'px'; });
document.addEventListener('touchmove', e => { if (!resizing) return; scriptPanel.style.width = Math.max(160, Math.min(600, startW + e.touches[0].clientX - startX)) + 'px'; }, { passive: true });
document.addEventListener('mouseup',  () => { resizing = false; resizeHandle.classList.remove('dragging'); });
document.addEventListener('touchend', () => { resizing = false; resizeHandle.classList.remove('dragging'); });

// ── 핀치 줌 (화면 전체 scale) ──
let pinchStartDist = 0, pinchStartZoom = 1;

function getTouchDist(t) {
  const dx = t[0].clientX - t[1].clientX;
  const dy = t[0].clientY - t[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

prompterWrap.addEventListener('touchstart', e => {
  if (resizing) return;
  if (e.touches.length === 2) {
    e.preventDefault();
    pinchStartDist = getTouchDist(e.touches);
    pinchStartZoom = state.zoom;
  }
}, { passive: false });

prompterWrap.addEventListener('touchmove', e => {
  if (resizing) return;
  if (e.touches.length === 2) {
    e.preventDefault();
    const dist = getTouchDist(e.touches);
    const newZoom = pinchStartZoom * (dist / pinchStartDist);
    applyZoom(newZoom, getScrollRatio());
  }
}, { passive: false });

// ── FILE UPLOAD ──
const uploadBtn    = document.getElementById('uploadBtn');
const fileInput    = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');

uploadBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';
  const ext = file.name.split('.').pop().toLowerCase();
  uploadStatus.className = '';
  uploadStatus.textContent = '읽는 중...';
  try {
    let text = '';
    if (ext === 'txt')       text = await readTxt(file);
    else if (ext === 'docx') text = await readDocx(file);
    else throw new Error('docx 또는 txt 파일만 가능합니다');
    state.text = text.trim();
    scriptInput.value = state.text;
    renderPrompter(0);
    uploadStatus.textContent = '✓ ' + file.name;
    setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
  } catch(e) {
    uploadStatus.className = 'err';
    uploadStatus.textContent = '⚠ ' + e.message;
  }
});

function readTxt(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = e => resolve(e.target.result);
    r.onerror = () => reject(new Error('파일을 읽을 수 없습니다'));
    r.readAsText(file, 'UTF-8');
  });
}

async function readDocx(file) {
  if (!window.mammoth) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('라이브러리 로드 실패 (인터넷 연결 확인)'));
      document.head.appendChild(s);
    });
  }
  const arrayBuffer = await file.arrayBuffer();
  const htmlResult  = await mammoth.convertToHtml({ arrayBuffer });
  if (!htmlResult.value) throw new Error('텍스트를 추출할 수 없습니다');
  return parseDocxHtml(htmlResult.value);
}

function parseDocxHtml(html) {
  const SECTION_RE = /^(오프닝|작품설명|엔딩)$/;
  const BREAK_RE   = /^\[(챕터|작품)\s*\S*\]$/;
  const parser = new DOMParser();
  const doc    = parser.parseFromString(html, 'text/html');
  const result = [];

  function addBreak() { if (result.length > 0) { result.push(''); result.push(''); } }
  function collapse(text) { return text.split(/\n/).map(l => l.trim()).filter(Boolean).join(' '); }

  const tables = doc.querySelectorAll('table');
  if (tables.length > 0) {
    tables.forEach(table => {
      table.querySelectorAll('tr').forEach(row => {
        const cells     = row.querySelectorAll('td, th');
        if (!cells.length) return;
        const leftText  = cells[0] ? cells[0].innerText.trim() : '';
        const rightText = cells[1] ? cells[1].innerText.trim() : '';
        const isSection = SECTION_RE.test(leftText);
        const isBreak   = BREAK_RE.test(leftText);
        if (isSection || isBreak) {
          addBreak();
          result.push(leftText);
          if (rightText) result.push(collapse(rightText));
        } else {
          const content = rightText || leftText;
          if (content) result.push(collapse(content));
        }
      });
    });
  } else {
    let bodyLines = [];
    doc.querySelectorAll('p').forEach(p => {
      const text = p.innerText.trim();
      if (!text) return;
      if (SECTION_RE.test(text) || BREAK_RE.test(text)) {
        if (bodyLines.length) { result.push(bodyLines.join(' ')); bodyLines = []; }
        addBreak();
        result.push(text);
      } else {
        bodyLines.push(text);
      }
    });
    if (bodyLines.length) result.push(bodyLines.join(' '));
  }
  return result.join('\n');
}
