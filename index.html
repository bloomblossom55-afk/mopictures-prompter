<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프롬프터</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&family=JetBrains+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0a0a0a;
    --surface: #111;
    --border: #222;
    --accent: #e8c96d;
    --accent2: #6de8c9;
    --text: #f0f0f0;
    --muted: #555;
    --panel-w: 320px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    max-height: 100%;
    overflow: hidden;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans KR', sans-serif;
    height: 100dvh;
    max-height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: fixed;
    width: 100%;
    top: 0; left: 0;
  }

  /* ── TOP BAR ── */
  #topbar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    flex-wrap: nowrap;
    overflow: hidden;
    height: 44px;
    min-height: 44px;
  }

  .num-input {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--accent);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    width: 46px;
    height: 24px;
    text-align: center;
    outline: none;
    padding: 0 2px;
  }
  .num-input:focus { border-color: var(--accent); }
  .num-unit { font-size: 10px; color: var(--muted); }

  #topbar .logo {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
    margin-right: 6px;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
    border-left: 1px solid var(--border);
    padding-left: 10px;
  }

  .ctrl-label {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
  }

  input[type=range] {
    -webkit-appearance: none;
    height: 3px;
    border-radius: 2px;
    background: var(--border);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px; height: 13px;
    border-radius: 50%;
    background: var(--accent);
    cursor: pointer;
  }

  .val-badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 32px;
    text-align: right;
  }

  /* icon buttons */
  .btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
    font-family: inherit;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.active { background: var(--accent); color: #000; border-color: var(--accent); }



  /* ── SEARCH BAR ── */
  #searchBar {
    display: none;
    align-items: center;
    gap: 8px;
    padding: 6px 14px;
    background: #0f0f0f;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  #searchBar.open { display: flex; }

  #searchInput {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 14px;
    padding: 5px 10px;
    outline: none;
    font-family: inherit;
  }
  #searchInput:focus { border-color: var(--accent2); }

  #searchInfo {
    font-size: 12px;
    color: var(--muted);
    min-width: 70px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }

  /* ── MAIN LAYOUT ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
    min-height: 0;
  }

  /* ── SCRIPT PANEL ── */
  #scriptPanel {
    width: var(--panel-w);
    min-width: 200px;
    background: #0d0d0d;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    overflow: hidden;
    min-height: 0;
  }
  #scriptPanel.hidden { display: none; }

  #scriptPanel .panel-title {
    padding: 8px 12px;
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--muted);
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  #uploadArea {
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  #uploadArea .btn { width: 100%; text-align: center; font-size: 12px; }
  #uploadStatus {
    font-size: 11px;
    color: var(--accent2);
    min-height: 14px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
  }
  #uploadStatus.err { color: #e86d6d; }

  #scriptInput {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 13px;
    line-height: 1.8;
    padding: 14px;
    resize: none;
    outline: none;
    font-family: 'Noto Sans KR', sans-serif;
    min-height: 0;
    overflow-y: auto;
  }

  /* 스크립트 검색 하이라이트 오버레이 */
  #scriptHighlightWrap {
    flex: 1;
    position: relative;
    min-height: 0;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  #scriptHighlight {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    font-size: 13px;
    line-height: 1.8;
    padding: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    white-space: pre-wrap;
    word-break: break-word;
    color: transparent;
    pointer-events: none;
    overflow-y: auto;
    scrollbar-width: none;
    z-index: 1;
  }
  #scriptHighlight::-webkit-scrollbar { display: none; }
  #scriptHighlight mark {
    background: rgba(232,201,109,.45);
    color: transparent;
    border-radius: 2px;
  }
  #scriptHighlight mark.current {
    background: var(--accent);
  }

  /* ── PROMPTER ── */
  #prompterWrap {
    flex: 1;
    overflow: hidden;
    position: relative;
    background: var(--bg);
  }

  #prompter {
    height: 100%;
    overflow-y: auto;
    overflow-x: hidden;
    scroll-behavior: smooth;
    padding: 60px 0;
    /* hide scrollbar */
    scrollbar-width: none;
  }
  #prompter::-webkit-scrollbar { display: none; }

  #prompterContent {
    margin: 0 auto;
    line-height: 1.7;
    color: var(--text);
    white-space: pre-wrap;
    word-break: break-word;
    /* width & font-size set via JS */
  }



  /* highlight */
  #prompterContent mark.hit {
    background: rgba(232,201,109,.25);
    color: var(--accent);
    border-radius: 2px;
    padding: 0 1px;
  }
  #prompterContent mark.hit.current {
    background: var(--accent);
    color: #000;
  }

  /* scroll position indicator */
  #posBar {
    position: absolute;
    right: 0; top: 0; bottom: 0;
    width: 3px;
    background: var(--border);
  }
  #posThumb {
    width: 3px;
    background: var(--accent);
    border-radius: 2px;
    position: absolute;
    top: 0;
    transition: top .1s;
    min-height: 20px;
  }

  /* speed overlay */


  /* ── SCRIPT SEARCH BAR ── */
  #scriptSearchBar {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px 8px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: #0d0d0d;
  }
  #scriptSearchInput {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    font-size: 12px;
    padding: 3px 7px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  #scriptSearchInput:focus { border-color: var(--accent2); }
  #scriptSearchInfo {
    font-size: 10px;
    color: var(--muted);
    min-width: 40px;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }

  /* resize handle */
  #resizeHandle {
    width: 5px;
    cursor: col-resize;
    background: transparent;
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }
  #resizeHandle:hover, #resizeHandle.dragging {
    background: var(--accent);
    opacity: .5;
  }


</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <span class="logo">PROMPTER</span>

  <div class="ctrl-group">
    <span class="ctrl-label">글자</span>
    <input class="num-input" type="number" id="fontInput" min="10" max="200" value="48">
    <span class="num-unit">px</span>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">너비</span>
    <input class="num-input" type="number" id="widthInput" min="20" max="100" value="80">
    <span class="num-unit">%</span>
  </div>

  <div class="ctrl-group">
    <span class="ctrl-label">줄간격</span>
    <input class="num-input" type="number" id="lineInput" min="1" max="4" step="0.1" value="1.7" style="width:42px">
  </div>

  <div class="ctrl-group">
    <button class="btn" id="boldBtn" title="볼드체" style="font-weight:700;font-size:13px;min-width:28px">B</button>
  </div>

  <div class="ctrl-group" style="gap:5px">
    <button class="btn" id="searchToggle" title="검색 (Ctrl+F)">🔍 검색</button>
    <button class="btn" id="panelToggle" title="스크립트 패널">📝 스크립트</button>
  </div>
</div>

<!-- SEARCH BAR -->
<div id="searchBar">
  <span style="color:var(--accent2);font-size:12px;white-space:nowrap">🔍 검색</span>
  <input type="text" id="searchInput" placeholder="검색어 입력...">
  <span id="searchInfo">0 / 0</span>
  <button class="btn" id="prevHit">▲</button>
  <button class="btn" id="nextHit">▼</button>
  <button class="btn" id="closeSearch">✕</button>
</div>

<!-- MAIN -->
<div id="main">
  <!-- Script panel -->
  <div id="scriptPanel">
    <div class="panel-title" style="display:flex;align-items:center;justify-content:space-between">
      <span>스크립트</span>
      <button class="btn" id="scriptSearchToggle" style="font-size:10px;padding:2px 6px;height:20px">🔍</button>
    </div>
    <div id="scriptSearchBar" style="display:none">
      <input type="text" id="scriptSearchInput" placeholder="스크립트 검색...">
      <span id="scriptSearchInfo">0 / 0</span>
      <button class="btn" id="scriptPrevHit" style="padding:2px 6px">▲</button>
      <button class="btn" id="scriptNextHit" style="padding:2px 6px">▼</button>
      <button class="btn" id="scriptCloseSearch" style="padding:2px 6px">✕</button>
    </div>
    <div id="uploadArea">
      <input type="file" id="fileInput" accept=".docx,.txt" style="display:none">
      <button class="btn" id="uploadBtn">📂 파일 불러오기 &nbsp;<span style="color:var(--muted);font-size:10px;">docx · txt</span></button>
      <div id="uploadStatus"></div>
    </div>
    <div id="scriptHighlightWrap">
      <div id="scriptHighlight"></div>
      <textarea id="scriptInput" placeholder="여기에 자막/스크립트를 입력하세요...

예시:
안녕하세요, 여러분.
오늘은 중요한 내용을 발표하겠습니다.

준비되셨나요?" style="position:relative;z-index:2;background:transparent;"></textarea>
    </div>
  </div>

  <!-- Resize handle -->
  <div id="resizeHandle"></div>

  <!-- Prompter -->
  <div id="prompterWrap">
    <div id="prompter">
      <div id="prompterContent"></div>
    </div>
    <div id="posBar"><div id="posThumb"></div></div>
  </div>
</div>



<script>
// ── STATE ──
const state = {
  text: `안녕하세요, 여러분.\n\n오늘 발표에 오신 것을 환영합니다.\n\n저는 오늘 우리 팀이 지난 한 달간 준비한 프로젝트에 대해 말씀드리려고 합니다.\n\n먼저 배경 설명부터 시작하겠습니다.\n\n우리가 이 프로젝트를 시작하게 된 이유는 명확합니다.\n\n고객들의 요구사항이 빠르게 변화하고 있으며, 우리는 그에 맞춰 발 빠르게 대응해야 했습니다.\n\n팀원 모두가 밤낮으로 노력한 결과, 오늘 이 자리에서 여러분께 결과물을 보여드릴 수 있게 되었습니다.\n\n다음으로 주요 기능에 대해 설명드리겠습니다.\n\n첫 번째 기능은 실시간 데이터 분석입니다.\n\n두 번째 기능은 자동화된 보고서 생성입니다.\n\n세 번째 기능은 다양한 플랫폼과의 연동입니다.\n\n이 세 가지 기능이 결합되면 업무 효율이 크게 향상될 것으로 기대됩니다.\n\n마지막으로 향후 계획에 대해 말씀드리겠습니다.\n\n다음 분기에는 베타 테스트를 진행할 예정이며, 여러분의 소중한 피드백을 반영하여 더 나은 제품을 만들어 나가겠습니다.\n\n감사합니다.`,
  fontSize: 48,
  width: 80,
  lineHeight: 1.7,
  bold: false,
  searchHits: [],
  currentHit: -1,
  // position tracking: ratio 0~1
  scrollRatio: 0,
};

// ── ELEMENTS ──
const prompter      = document.getElementById('prompter');
const prompterContent = document.getElementById('prompterContent');
const scriptInput   = document.getElementById('scriptInput');
const fontInput     = document.getElementById('fontInput');
const widthInput    = document.getElementById('widthInput');
const lineInput     = document.getElementById('lineInput');
const boldBtn       = document.getElementById('boldBtn');
const panelToggle   = document.getElementById('panelToggle');
const searchToggle  = document.getElementById('searchToggle');
const searchBar     = document.getElementById('searchBar');
const searchInput   = document.getElementById('searchInput');
const searchInfo    = document.getElementById('searchInfo');
const prevHit       = document.getElementById('prevHit');
const nextHit       = document.getElementById('nextHit');
const closeSearch   = document.getElementById('closeSearch');
const posThumb      = document.getElementById('posThumb');

const scriptPanel   = document.getElementById('scriptPanel');
const resizeHandle  = document.getElementById('resizeHandle');


// ── INIT ──
scriptInput.value = state.text;
renderPrompter();
applyStyles();

// ── ORIENTATION 변경 시 스크롤 위치 유지 ──
window.addEventListener('orientationchange', () => {
  const ratio = getScrollRatio();
  setTimeout(() => setScrollRatio(ratio), 300);
});
window.addEventListener('resize', () => {
  const ratio = getScrollRatio();
  requestAnimationFrame(() => setScrollRatio(ratio));
});

// ── RENDER ──
function renderPrompter(keepRatio) {
  const ratio = keepRatio !== undefined ? keepRatio : getScrollRatio();
  prompterContent.innerHTML = escapeAndMark(state.text);
  // re-highlight if search active
  if (searchBar.classList.contains('open') && searchInput.value) {
    applySearch(searchInput.value, false);
  }
  // restore scroll position
  requestAnimationFrame(() => {
    setScrollRatio(ratio);
    updatePosBar();
  });
}

function escapeAndMark(text) {
  return text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;');
}

function applyStyles(keepRatio) {
  const ratio = keepRatio !== undefined ? keepRatio : getScrollRatio();
  prompterContent.style.fontSize = state.fontSize + 'px';
  prompterContent.style.width = state.width + '%';
  prompterContent.style.lineHeight = state.lineHeight;
  prompterContent.style.fontWeight = state.bold ? '700' : '400';
  requestAnimationFrame(() => setScrollRatio(ratio));
}

// ── SCROLL RATIO ──
function getScrollRatio() {
  const max = prompter.scrollHeight - prompter.clientHeight;
  return max <= 0 ? 0 : prompter.scrollTop / max;
}

function setScrollRatio(ratio) {
  const max = prompter.scrollHeight - prompter.clientHeight;
  prompter.scrollTop = ratio * max;
}

function updatePosBar() {
  const ratio = getScrollRatio();
  const barH = document.getElementById('posBar').clientHeight;
  const thumbH = Math.max(20, barH * (prompter.clientHeight / prompter.scrollHeight));
  posThumb.style.height = thumbH + 'px';
  posThumb.style.top = (ratio * (barH - thumbH)) + 'px';
}

// ── CONTROLS ──
fontInput.addEventListener('change', () => {
  const v = Math.min(200, Math.max(10, +fontInput.value || 48));
  fontInput.value = v;
  state.fontSize = v;
  applyStyles(getScrollRatio());
});

widthInput.addEventListener('change', () => {
  const v = Math.min(100, Math.max(20, +widthInput.value || 80));
  widthInput.value = v;
  state.width = v;
  applyStyles(getScrollRatio());
});

lineInput.addEventListener('change', () => {
  const v = Math.min(4, Math.max(1, +lineInput.value || 1.7));
  lineInput.value = v;
  state.lineHeight = v;
  applyStyles(getScrollRatio());
});

boldBtn.addEventListener('click', () => {
  state.bold = !state.bold;
  boldBtn.classList.toggle('active', state.bold);
  applyStyles(getScrollRatio());
});

scriptInput.addEventListener('input', () => {
  state.text = scriptInput.value;
  // 현재 프롬프터 스크롤 위치를 유지하며 반영
  const ratio = getScrollRatio();
  prompterContent.innerHTML = escapeAndMark(state.text);
  requestAnimationFrame(() => {
    setScrollRatio(ratio);
    updatePosBar();
  });
  // 검색 중이면 오버레이도 갱신
  if (scriptSearchInput.value) renderScriptHighlight(scriptSearchInput.value, scriptCurrentHit);
});

prompter.addEventListener('scroll', updatePosBar);



// ── PLAY / PAUSE ──




// ── MIRROR ──


// ── PANEL TOGGLE ──
panelToggle.addEventListener('click', () => {
  scriptPanel.classList.toggle('hidden');
  panelToggle.classList.toggle('active', !scriptPanel.classList.contains('hidden'));
  // keep ratio after layout change
  const ratio = getScrollRatio();
  requestAnimationFrame(() => setScrollRatio(ratio));
});
panelToggle.classList.add('active');

// ── EDIT MODAL ──


// ── SEARCH ──
searchToggle.addEventListener('click', openSearch);

function openSearch() {
  searchBar.classList.add('open');
  searchInput.focus();
  searchInput.select();
}

closeSearch.addEventListener('click', () => {
  searchBar.classList.remove('open');
  searchInput.value = '';
  clearHighlights();
  searchInfo.textContent = '0 / 0';
  state.searchHits = [];
  state.currentHit = -1;
});

searchInput.addEventListener('input', () => {
  applySearch(searchInput.value, true);
});

function applySearch(query, resetIndex) {
  clearHighlights();
  state.searchHits = [];
  state.currentHit = -1;

  if (!query) {
    searchInfo.textContent = '0 / 0';
    return;
  }

  // Highlight in HTML
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  let idx = 0;
  prompterContent.innerHTML = escapeAndMark(state.text).replace(regex, (m) => {
    return `<mark class="hit" data-idx="${idx++}">${m}</mark>`;
  });

  state.searchHits = Array.from(prompterContent.querySelectorAll('mark.hit'));
  searchInfo.textContent = `0 / ${state.searchHits.length}`;

  if (resetIndex && state.searchHits.length > 0) {
    jumpToHit(0); // 항상 첫 번째 결과로 이동
  }
}

function jumpToHit(i) {
  if (!state.searchHits.length) return;
  if (state.currentHit >= 0 && state.currentHit < state.searchHits.length)
    state.searchHits[state.currentHit].classList.remove('current');
  state.currentHit = (i + state.searchHits.length) % state.searchHits.length;
  const el = state.searchHits[state.currentHit];
  el.classList.add('current');
  searchInfo.textContent = `${state.currentHit + 1} / ${state.searchHits.length}`;
  // scroll so hit is near center
  const targetTop = el.offsetTop - prompter.clientHeight / 2 + el.offsetHeight / 2;
  prompter.scrollTo({ top: targetTop, behavior: 'smooth' });
  setTimeout(updatePosBar, 350);
}

nextHit.addEventListener('click', () => jumpToHit(state.currentHit + 1));
prevHit.addEventListener('click', () => jumpToHit(state.currentHit - 1));

function clearHighlights() {
  // re-render plain text to remove all marks
  prompterContent.innerHTML = escapeAndMark(state.text);
}

// ── KEYBOARD SHORTCUTS ──
document.addEventListener('keydown', e => {
  // prevent in textareas/inputs
  const tag = document.activeElement.tagName;
  if (tag === 'TEXTAREA' || tag === 'INPUT') {
    if (e.key === 'Escape') {
      document.activeElement.blur();
      if (searchBar.classList.contains('open')) closeSearch.click();
    }
    return;
  }

  if (e.ctrlKey && e.key === 'f') { e.preventDefault(); openSearch(); return; }
  if (e.key === 'ArrowUp')   { prompter.scrollBy({top: -80, behavior:'smooth'}); }
  if (e.key === 'ArrowDown') { prompter.scrollBy({top:  80, behavior:'smooth'}); }
  if (e.key === 'Escape') {
    if (searchBar.classList.contains('open')) closeSearch.click();
  }
});

// ── SCRIPT PANEL SEARCH ──
const scriptSearchToggle  = document.getElementById('scriptSearchToggle');
const scriptSearchBar     = document.getElementById('scriptSearchBar');
const scriptSearchInput   = document.getElementById('scriptSearchInput');
const scriptSearchInfo    = document.getElementById('scriptSearchInfo');
const scriptPrevHit       = document.getElementById('scriptPrevHit');
const scriptNextHit       = document.getElementById('scriptNextHit');
const scriptCloseSearch   = document.getElementById('scriptCloseSearch');

let scriptHits = [], scriptCurrentHit = -1;

scriptSearchToggle.addEventListener('click', () => {
  const open = scriptSearchBar.style.display === 'none' || scriptSearchBar.style.display === '';
  scriptSearchBar.style.display = open ? 'flex' : 'none';
  if (open) { scriptSearchInput.focus(); scriptSearchInput.select(); }
  else { clearScriptSearch(); }
});

scriptCloseSearch.addEventListener('click', () => {
  scriptSearchBar.style.display = 'none';
  clearScriptSearch();
});

scriptSearchInput.addEventListener('input', () => {
  runScriptSearch(scriptSearchInput.value);
});

// 오버레이 하이라이트 요소
const scriptHighlight = document.getElementById('scriptHighlight');

// 스크립트 textarea 스크롤 시 오버레이도 동기화
scriptInput.addEventListener('scroll', () => {
  scriptHighlight.scrollTop = scriptInput.scrollTop;
});

function runScriptSearch(query) {
  scriptHits = []; scriptCurrentHit = -1;
  if (!query) {
    scriptSearchInfo.textContent = '0 / 0';
    renderScriptHighlight('', -1);
    return;
  }
  const text = scriptInput.value;
  const lower = text.toLowerCase();
  const qLower = query.toLowerCase();
  let pos = 0;
  while ((pos = lower.indexOf(qLower, pos)) !== -1) {
    scriptHits.push(pos);
    pos += qLower.length;
  }
  scriptSearchInfo.textContent = `0 / ${scriptHits.length}`;
  if (scriptHits.length > 0) {
    scriptCurrentHit = 0;
    scriptSearchInfo.textContent = `1 / ${scriptHits.length}`;
  }
  renderScriptHighlight(query, scriptCurrentHit);
  if (scriptHits.length > 0) scrollScriptToHit(scriptCurrentHit);
}

function jumpScriptHit(i) {
  if (!scriptHits.length) return;
  scriptCurrentHit = (i + scriptHits.length) % scriptHits.length;
  scriptSearchInfo.textContent = `${scriptCurrentHit + 1} / ${scriptHits.length}`;
  renderScriptHighlight(scriptSearchInput.value, scriptCurrentHit);
  scrollScriptToHit(scriptCurrentHit);
}

function scrollScriptToHit(i) {
  // 오버레이 스크롤 위치 계산 (focus/selection 없이)
  const pos = scriptHits[i];
  const textBefore = scriptInput.value.substring(0, pos);
  const lines = textBefore.split('\n').length - 1;
  const lineH = parseFloat(getComputedStyle(scriptInput).lineHeight) || 22;
  const target = lines * lineH - scriptInput.clientHeight / 2 + lineH;
  scriptInput.scrollTop = Math.max(0, target);
  scriptHighlight.scrollTop = scriptInput.scrollTop;
}

function renderScriptHighlight(query, currentIdx) {
  const text = scriptInput.value;
  if (!query) { scriptHighlight.innerHTML = ''; return; }
  const escaped_q = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped_q})`, 'gi');
  let hitIdx = 0;
  const html = escapeForOverlay(text).replace(regex, (m) => {
    const cls = hitIdx++ === currentIdx ? 'current' : '';
    return `<mark class="${cls}">${m}</mark>`;
  });
  scriptHighlight.innerHTML = html;
  scriptHighlight.scrollTop = scriptInput.scrollTop;
}

function escapeForOverlay(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}



function clearScriptSearch() {
  scriptHits = []; scriptCurrentHit = -1;
  scriptSearchInput.value = '';
  scriptSearchInfo.textContent = '0 / 0';
  scriptHighlight.innerHTML = '';
}

scriptPrevHit.addEventListener('click', () => jumpScriptHit(scriptCurrentHit - 1));
scriptNextHit.addEventListener('click', () => jumpScriptHit(scriptCurrentHit + 1));

// ── RESIZE PANEL ──
let resizing = false, startX = 0, startW = 0;
resizeHandle.addEventListener('mousedown', e => {
  resizing = true;
  startX = e.clientX;
  startW = scriptPanel.offsetWidth;
  resizeHandle.classList.add('dragging');
});
document.addEventListener('mousemove', e => {
  if (!resizing) return;
  const delta = e.clientX - startX;
  const newW = Math.max(150, Math.min(600, startW + delta));
  scriptPanel.style.width = newW + 'px';
});
document.addEventListener('mouseup', () => {
  if (resizing) { resizing = false; resizeHandle.classList.remove('dragging'); }
});

// ── INITIAL SPEEDHUD ──

// ── FILE UPLOAD ──
const uploadBtn    = document.getElementById('uploadBtn');
const fileInput    = document.getElementById('fileInput');
const uploadStatus = document.getElementById('uploadStatus');

uploadBtn.addEventListener('click', () => fileInput.click());

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  fileInput.value = '';

  const ext = file.name.split('.').pop().toLowerCase();
  uploadStatus.className = '';
  uploadStatus.textContent = '읽는 중...';

  try {
    let text = '';
    if (ext === 'txt') {
      text = await readTxt(file);
    } else if (ext === 'docx') {
      text = await readDocx(file);
    } else {
      throw new Error('docx 또는 txt 파일만 가능합니다');
    }

    state.text = text.trim();
    scriptInput.value = state.text;
    renderPrompter(0);
    uploadStatus.textContent = '✓ ' + file.name;
    setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
  } catch (e) {
    uploadStatus.className = 'err';
    uploadStatus.textContent = '⚠ ' + e.message;
  }
});

function readTxt(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = () => reject(new Error('파일을 읽을 수 없습니다'));
    reader.readAsText(file, 'UTF-8');
  });
}

async function readDocx(file) {
  if (!window.mammoth) {
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
      s.onload = resolve;
      s.onerror = () => reject(new Error('라이브러리 로드 실패 (인터넷 연결 확인)'));
      document.head.appendChild(s);
    });
  }
  const arrayBuffer = await file.arrayBuffer();
  const result = await mammoth.extractRawText({ arrayBuffer });
  if (!result.value) throw new Error('텍스트를 추출할 수 없습니다');
  return formatScript(result.value);
}

function formatScript(raw) {
  // 단락 구분 키워드: 오프닝, 작품설명, 엔딩 / [챕터 숫자]
  const SECTION_RE = /^(오프닝|작품설명|엔딩)$/;
  const CHAPTER_RE = /^\[(챕터|작품)\s*\S*\]/;

  const lines = raw.split(/\r?\n/);
  const result = [];
  let prevWasContent = false;

  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    // 빈 줄 → 무시
    if (!line) continue;

    const isSection = SECTION_RE.test(line);
    const isChapter = CHAPTER_RE.test(line);

    if (isSection || isChapter) {
      // 단락 구분: 앞에 빈 줄 추가 (결과가 비어있지 않을 때만)
      if (result.length > 0) result.push('');
      result.push(line);
      prevWasContent = false;
    } else {
      // 일반 본문: 이어붙이기 (줄바꿈 제거)
      if (prevWasContent) {
        // 직전 줄에 이어붙임
        result[result.length - 1] += ' ' + line;
      } else {
        result.push(line);
        prevWasContent = true;
      }
    }
  }

  return result.join('\n');
}
